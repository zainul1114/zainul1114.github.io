<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NCA-AIIO — Interactive Practice Quiz</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f1f1f;
      --muted: #5f6368;
      --card-bg: #f1f3f4;
      --card-hover: #e8eaed;
      --correct-bg: #ceead6;
      --correct-accent: #1e8e3e;
      --wrong-bg: #f1f3f4;
      --wrong-accent: #d93025;
      --primary: #0b57d0;
      --progress-inactive: #e0e0e0;
    }
    * { box-sizing: border-box; font-family: "Google Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 32px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 740px; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
    .header h1 { font-size: 1.4rem; font-weight: 600; margin: 0; line-height: 1.35; }
    .text-view-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; white-space: nowrap; padding: 6px 10px; border-radius: 8px; }
    .text-view-btn:hover { background: var(--card-bg); color: var(--text); }

    /* Quiz Selector */
    .controls-row { display: flex; width: 100%; margin-bottom: 24px; }
    .quiz-select {
      width: 100%; max-width: 100%; min-width: 0;
      padding: 10px 14px; border-radius: 10px; border: 1px solid #dadce0;
      font-size: 0.95rem; background: #fff; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Segmented Progress Bar with Checkmarks */
    .progress-row { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 26px; }
    .segments { display: flex; flex: 1; gap: 5px; align-items: flex-end; }
    .seg-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 4px; }
    .seg-icon { font-size: 0.72rem; height: 14px; line-height: 14px; margin-bottom: 3px; font-weight: 700; }
    .seg-icon.ok { color: var(--correct-accent); }
    .seg-icon.err { color: var(--wrong-accent); }
    .segment { width: 100%; height: 4px; background: var(--progress-inactive); border-radius: 2px; }
    .segment.active { background: var(--primary); }
    .segment.done-ok { background: var(--correct-accent); }
    .segment.done-err { background: var(--wrong-accent); }
    .counter { font-size: 0.9rem; color: var(--muted); white-space: nowrap; padding-bottom: 1px; }

    /* Question & Options */
    .question-text { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option {
      background: var(--card-bg); border: 1.5px solid transparent; border-radius: 12px;
      padding: 14px 18px; cursor: pointer; text-align: left; transition: background 0.15s;
    }
    .option:hover:not(.locked) { background: var(--card-hover); }
    .option.correct { background: var(--correct-bg); }
    .option.wrong { background: var(--wrong-bg); border-color: #dadce0; }
    .option-header { display: flex; gap: 10px; font-size: 0.98rem; font-weight: 500; line-height: 1.45; }
    .feedback { margin-top: 8px; margin-left: 24px; font-size: 0.92rem; line-height: 1.45; color: #3c4043; display: none; }
    .option.show-feedback .feedback { display: block; }

    /* Footer */
    .footer { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 24px; gap: 16px; }
    .hint-box { flex: 1; }
    .hint-toggle { background: none; border: none; color: var(--text); font-weight: 500; cursor: pointer; padding: 0; font-size: 0.95rem; }
    .hint-text { margin-top: 8px; font-size: 0.92rem; color: var(--muted); line-height: 1.45; display: none; }
    .hint-text.open { display: block; }
    .nav-btns { display: flex; gap: 10px; }
    .btn { border: none; border-radius: 24px; padding: 10px 24px; font-size: 0.95rem; font-weight: 500; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--card-bg); color: var(--text); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Summary & Text View */
    .summary-card { background: var(--card-bg); border-radius: 14px; padding: 28px; text-align: center; }
    .score-big { font-size: 2.4rem; font-weight: 700; color: var(--primary); margin: 12px 0; }
    .text-view-item { border-bottom: 1px solid #e0e0e0; padding: 16px 0; }
    .text-view-item p { margin: 8px 0 0; font-size: 0.95rem; line-height: 1.5; color: #3c4043; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 id="quizTitle">NCA-AIIO Practice Quiz</h1>
      <button class="text-view-btn" id="toggleViewBtn">☰ Text view</button>
    </div>

    <div class="controls-row">
      <select class="quiz-select" id="quizSelect"></select>
    </div>

    <div id="interactiveView">
      <div class="progress-row">
        <div class="segments" id="segments"></div>
        <div class="counter" id="counter"></div>
      </div>

      <div id="quizBody">
        <div class="question-text" id="questionText">Loading questions...</div>
        <div class="options" id="optionsContainer"></div>

        <div class="footer">
          <div class="hint-box">
            <button class="hint-toggle" id="hintToggle">Show hint ⌄</button>
            <div class="hint-text" id="hintText"></div>
          </div>
          <div class="nav-btns">
            <button class="btn btn-secondary" id="prevBtn">Back</button>
            <button class="btn btn-primary" id="nextBtn">Next</button>
          </div>
        </div>
      </div>

      <div id="summaryView" class="summary-card hidden">
        <h2>Quiz Complete</h2>
        <div class="score-big" id="scoreDisplay"></div>
        <p id="scoreSubtext"></p>
        <button class="btn btn-primary" id="restartBtn">Restart Quiz</button>
      </div>
    </div>

    <div id="textView" class="hidden"></div>
  </div>

  <script>
    const labels = ["A", "B", "C", "D"];
    let allSets = [];
    let questions = [];
    let current = 0;
    let states = []; // { solved: bool, hadWrong: bool, tried: Set<number> }
    let isTextView = false;

    const quizSelect = document.getElementById("quizSelect");
    const quizTitle = document.getElementById("quizTitle");
    const segmentsEl = document.getElementById("segments");
    const counterEl = document.getElementById("counter");
    const questionEl = document.getElementById("questionText");
    const optionsEl = document.getElementById("optionsContainer");
    const hintToggle = document.getElementById("hintToggle");
    const hintText = document.getElementById("hintText");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const quizBody = document.getElementById("quizBody");
    const summaryView = document.getElementById("summaryView");

    fetch("./questions.json")
      .then(r => r.json())
      .then(data => {
        allSets = data;
        const allCombined = data.flatMap(s => s.questions);
        quizSelect.innerHTML =
          data.map((s, i) => `<option value="${i}">${s.title} (${s.questions.length} Qs)</option>`).join("") +
          `<option value="all">All Quizzes Combined (${allCombined.length} Qs)</option>`;
        loadSet(0);
      });

    function loadSet(val) {
      if (val === "all") {
        quizTitle.textContent = "NCA-AIIO — All Quizzes Combined";
        questions = allSets.flatMap(s => s.questions);
      } else {
        const set = allSets[Number(val)];
        quizTitle.textContent = set.title;
        questions = set.questions;
      }
      current = 0;
      states = questions.map(() => ({ solved: false, hadWrong: false, tried: new Set() }));
      if (isTextView) renderTextView();
      renderQuestion();
    }

    quizSelect.onchange = () => loadSet(quizSelect.value);

    function renderQuestion() {
      quizBody.classList.remove("hidden");
      summaryView.classList.add("hidden");

      const item = questions[current];
      const st = states[current];

      counterEl.textContent = `${current + 1} / ${questions.length}`;
      questionEl.textContent = `${current + 1}. ${item.q}`;

      // Render segments (show icons when <= 30 questions so it stays readable)
      const showIcons = questions.length <= 30;
      segmentsEl.innerHTML = "";
      questions.forEach((_, i) => {
        const s = states[i];
        const wrap = document.createElement("div");
        wrap.className = "seg-wrap";
        wrap.title = `Question ${i + 1}`;
        wrap.onclick = () => { current = i; renderQuestion(); };

        let iconHtml = "";
        let segClass = "segment";
        if (i === current) segClass += " active";
        if (s.solved && !s.hadWrong) {
          if (showIcons) iconHtml = `<div class="seg-icon ok">✓</div>`;
          if (i !== current) segClass += " done-ok";
        } else if (s.hadWrong) {
          if (showIcons) iconHtml = `<div class="seg-icon err">${s.solved ? "✓" : "✕"}</div>`;
          if (i !== current) segClass += s.solved ? " done-ok" : " done-err";
        } else if (showIcons) {
          iconHtml = `<div class="seg-icon"></div>`;
        }

        wrap.innerHTML = `${iconHtml}<div class="${segClass}"></div>`;
        segmentsEl.appendChild(wrap);
      });

      // Render options
      optionsEl.innerHTML = "";
      item.options.forEach((optText, idx) => {
        const div = document.createElement("div");
        div.className = "option";
        const isCorrect = idx === item.correctIndex;
        const feedbackMsg = isCorrect ? item.explanation : "Incorrect. Try another option.";

        div.innerHTML = `
          <div class="option-header"><span>${labels[idx]}.</span><span>${optText}</span></div>
          <div class="feedback">${feedbackMsg}</div>
        `;

        if (st.tried.has(idx)) {
          div.classList.add("show-feedback", "locked", isCorrect ? "correct" : "wrong");
        } else if (st.solved) {
          div.classList.add("locked");
        } else {
          div.onclick = () => {
            st.tried.add(idx);
            if (isCorrect) st.solved = true;
            else st.hadWrong = true;
            renderQuestion();
          };
        }
        optionsEl.appendChild(div);
      });

      hintText.textContent = item.hint;
      hintText.classList.remove("open");
      hintToggle.textContent = "Show hint ⌄";
      prevBtn.disabled = current === 0;
      nextBtn.textContent = current === questions.length - 1 ? "Finish" : "Next";
    }

    function renderTextView() {
      document.getElementById("textView").innerHTML = questions.map((item, i) => `
        <div class="text-view-item">
          <strong>${i + 1}. ${item.q}</strong>
          <p><strong>Answer: ${labels[item.correctIndex]})</strong> ${item.options[item.correctIndex]}</p>
          <p>${item.explanation}</p>
        </div>
      `).join("");
    }

    hintToggle.onclick = () => {
      const open = hintText.classList.toggle("open");
      hintToggle.textContent = open ? "Hide hint ⌃" : "Show hint ⌄";
    };

    prevBtn.onclick = () => { if (current > 0) { current--; renderQuestion(); } };
    nextBtn.onclick = () => {
      if (current < questions.length - 1) { current++; renderQuestion(); }
      else {
        quizBody.classList.add("hidden");
        summaryView.classList.remove("hidden");
        const firstTryCorrect = states.filter(s => s.solved && !s.hadWrong).length;
        const pct = Math.round((firstTryCorrect / questions.length) * 100);
        document.getElementById("scoreDisplay").textContent = `${firstTryCorrect} / ${questions.length} (${pct}%)`;
        document.getElementById("scoreSubtext").textContent = pct >= 70
          ? "First-try score looks strong! You are well-prepared for these NCA-AIIO topics."
          : "First-try score: review missed questions using the progress bar or Text view.";
      }
    };

    document.getElementById("restartBtn").onclick = () => loadSet(quizSelect.value);

    document.getElementById("toggleViewBtn").onclick = () => {
      isTextView = !isTextView;
      document.getElementById("interactiveView").classList.toggle("hidden", isTextView);
      document.getElementById("textView").classList.toggle("hidden", !isTextView);
      document.getElementById("toggleViewBtn").textContent = isTextView ? "Interactive view" : "☰ Text view";
      if (isTextView) renderTextView();
    };
  </script>
</body>
</html>
